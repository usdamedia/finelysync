      /* ============================================================
         APPLE HIG MATERIALS
         A material creates depth, layering and hierarchy between
         foreground and background elements.

         ─ Bar material (functional layer — tab bars, sidebars,
           sheets — the web equivalent of Liquid Glass).
         ─ Vibrancy keeps labels/fills/separators legible on top.
         ============================================================ */
      .material-ultra-thin,
      .material-thin,
      .material-regular,
      .material-thick,
      .material-ultra-thick,
      .material-bar {

        backdrop-filter: blur(20px) saturate(180%);

        backdrop-filter: blur(var(--material-blur-ultra-thin)) saturate(180%);

        background: var(--material-thin);
        -webkit-backdrop-filter: blur(var(--material-blur-thin)) saturate(180%);
        backdrop-filter: blur(var(--material-blur-thin)) saturate(180%);
      }

        background: var(--material-regular);
        -webkit-backdrop-filter: blur(var(--material-blur-regular)) saturate(180%);
        backdrop-filter: blur(var(--material-blur-regular)) saturate(180%);
      }

      .material-thick {
        background: var(--material-thick);
        -webkit-backdrop-filter: blur(var(--material-blur-thick)) saturate(180%);
        backdrop-filter: blur(var(--material-blur-thick)) saturate(180%);
      }

      .material-ultra-thick {

        backdrop-filter: blur(var(--material-blur-ultra-thick)) saturate(180%);

      .material-edge {

        inset: 0 0 auto 0;
        height: 1px;
        background: var(--material-edge);
        pointer-events: none;

      .material-scrim {
        background: var(--material-scrim);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }

      [class*='material-'].material-divider-l { border: none; border-left: 1px solid var(--material-border); }
      [class*='material-'].material-divider-t { border: none; border-top: 1px solid var(--material-border); }

      .vibrant-label { color: var(--vibrant-label); }
      .vibrant-secondary { color: var(--vibrant-secondary); }
      .vibrant-tertiary { color: var(--vibrant-tertiary); }

      .vibrant-fill { background: var(--vibrant-fill); }

      .vibrant-tertiary-fill { background: var(--vibrant-tertiary-fill); }
