# Cloudflare Workers — static assets deployment for FinelySync
# Connect this repo to a Worker (Builds) and Cloudflare will run `npm run build`
# then serve the generated `dist/` folder as static assets with SPA fallback.
#
# Required build-time environment variables (set in the Cloudflare dashboard):
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#   VITE_FIREBASE_APP_ID, VITE_FIREBASE_MEASUREMENT_ID

name = "finelysync"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
# Serve index.html for unknown routes (client-side routing / SPA)
not_found_handling = "single-page-application"
